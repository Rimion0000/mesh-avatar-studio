<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#eff5fd" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; connect-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'" />
    <title>Mio Viewer</title>
  </head>
  <body>
    <main>
      <header><div><p class="eyebrow">PRIVATE AVATAR</p><h1>Mio</h1></div><label class="file-button" for="avatar-file">ファイルを開く</label><input id="avatar-file" type="file" accept=".json,application/json" /></header>
      <p id="status" role="status">保存したMioを確認しています…</p>
      <section class="stage" aria-label="Mioの表示">
        <div id="welcome"><span class="star" aria-hidden="true">✦</span><h2>いつでも、Mioと。</h2><p>初回だけ、PCで作った<br /><strong>mio-viewer.json</strong> を選んでください。</p><label class="primary file-button" for="avatar-file">Mioを読み込む</label><p class="privacy">画像はこの端末内に保存します。<br />サーバーへの送信はありません。</p></div>
        <canvas id="avatar" aria-label="動くMioアバター" hidden></canvas>
      </section>
      <div id="controls" hidden>
        <button id="pause" type="button" aria-pressed="false">一時停止</button><button id="smile" type="button" aria-pressed="false">笑顔</button><button id="nod" type="button">うなずく</button>
      </div>
      <footer><span>画像は端末内だけに保存</span><button id="forget" type="button" hidden>保存を削除</button></footer>
    </main>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
